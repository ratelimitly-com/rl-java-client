name: publish-mvn

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Dry run, stage for Portal review, or finalize an already published deployment
        type: choice
        options: [dry-run, stage, finalize]
        default: dry-run
      expected_commit:
        description: Full main SHA (required for stage/finalize)
        type: string
      expected_version:
        description: Exact numeric POM version (required for stage/finalize)
        type: string
      portal_checked:
        description: I inspected Portal and confirmed no previous upload needs recovery (stage only)
        type: boolean
        default: false
      deployment_id:
        description: Existing Portal deployment UUID (finalize only)
        type: string

permissions:
  contents: read

concurrency:
  group: maven-${{ github.event_name == 'workflow_dispatch' && inputs.action != 'dry-run' && 'publication' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  MAVEN_HELP_PLUGIN: org.apache.maven.plugins:maven-help-plugin:3.5.2

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.metadata.outputs.build }}
      commit: ${{ steps.metadata.outputs.commit }}
      epoch: ${{ steps.metadata.outputs.epoch }}
      action: ${{ steps.metadata.outputs.action }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test fail-closed publication policy
        run: python3 tools/test_publication_policy.py
      - name: Validate explicit release identity
        id: metadata
        env:
          ACTION: ${{ inputs.action || 'dry-run' }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PORTAL_CHECKED: ${{ inputs.portal_checked }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          export COMMIT="$(git rev-parse HEAD)"
          export VERSION="$(mvn -B -ntp -q -DforceStdout "${MAVEN_HELP_PLUGIN}:evaluate" -Dexpression=project.version | tail -n 1 | tr -d '[:space:]')"
          python3 tools/publication_policy.py request >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  preflight:
    name: Require exact-main CI and CodeQL
    if: needs.metadata.outputs.action != 'dry-run'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful exact-commit checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/commits/$COMMIT/check-runs?per_page=100" |
            python3 tools/publication_policy.py checks "$COMMIT"
          gh api --paginate --slurp "repos/$GH_REPO/code-scanning/analyses?ref=refs/heads/main&per_page=100" |
            python3 tools/publication_policy.py analyses "$COMMIT"
          gh api --paginate --slurp "repos/$GH_REPO/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" |
            python3 tools/publication_policy.py alerts
          tag="v${{ needs.metadata.outputs.version }}"
          refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$refs" ]; then
            resolved="$(printf '%s\n' "$refs" | tail -n 1 | cut -f 1)"
            test "$resolved" = "$COMMIT"
          fi

  contracts:
    name: Maven verification (JDK ${{ matrix.java }})
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java:
          - '21'
          - '25'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Maven verification
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
        run: mvn -B -ntp verify

  jars:
    name: Build signed release dry run
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record toolchain
        run: |
          java -version
          mvn -v

      - name: Build and validate signed Central dry run
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          # The script creates a disposable signing key and never invokes deploy. Pull requests
          # therefore exercise signatures and Central bundle structure without registry access.
          ./tools/build-central-dry-run.sh "$VERSION"

          staged="$RUNNER_TEMP/release-jars"
          mkdir -p "$staged"
          for classifier in "" "-sources" "-javadoc"; do
            jar="target/ratelimitly-java-client-${VERSION}${classifier}.jar"
            if [[ ! -f "$jar" ]]; then
              echo "::error::expected ${jar}, which the build did not produce"
              exit 1
            fi
            cp "$jar" "$staged/"
          done
          cp pom.xml "$staged/ratelimitly-java-client-${VERSION}.pom"
          cp target/central-dry-run-bundle.zip "$RUNNER_TEMP/"
          ls -l "$staged"

      - name: Verify the jars are byte-reproducible
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
        run: |
          set -euo pipefail
          ( cd "$RUNNER_TEMP/release-jars" && sha256sum ./*.jar ) \
            | sed 's#\./##' | LC_ALL=C sort -k2 > "$RUNNER_TEMP/first-pass.sha256"

          mvn -B -ntp -DskipTests -Pcentral-release \
            -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" \
            clean package

          ( cd target && sha256sum ./*.jar ) \
            | sed 's#\./##' | LC_ALL=C sort -k2 > "$RUNNER_TEMP/second-pass.sha256"

          if ! diff -u "$RUNNER_TEMP/first-pass.sha256" "$RUNNER_TEMP/second-pass.sha256"; then
            echo "::error::two builds of the same commit produced different jars"
            exit 1
          fi
          {
            echo "### Reproducible jars"
            echo
            echo "Two independent builds of this commit agreed byte for byte."
            echo
            echo '```'
            cat "$RUNNER_TEMP/first-pass.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test the pre-publication artifact gate
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash tools/test-release-artifact-gate.sh "$VERSION"

      - name: Verify the release jar is consumable
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/release-jars/ratelimitly-java-client-${VERSION}.jar"
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/Consumer.java" <<'EOF'
          import com.ratelimitly.RateLimitlyClient;
          import com.ratelimitly.RateLimitlyClientConfig;
          import com.ratelimitly.RateLimitlyClients;
          import com.ratelimitly.RateLimitlyException;

          public final class Consumer {
              private Consumer() {
              }

              static RateLimitlyClient open(String apiKey)
                      throws RateLimitlyException {
                  return RateLimitlyClients.create(
                      RateLimitlyClientConfig.builder(apiKey).build());
              }
          }
          EOF
          javac --release 21 -cp "$jar" \
            -d "$RUNNER_TEMP/consumer" \
            "$RUNNER_TEMP/consumer/Consumer.java"

          mvn -B -ntp -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -Dmdep.includeScope=runtime \
            -Dmdep.outputFile="$RUNNER_TEMP/runtime-module-path.txt"
          mkdir -p "$RUNNER_TEMP/module-consumer/consumer"
          cat > "$RUNNER_TEMP/module-consumer/module-info.java" <<'EOF'
          module ratelimitly.consumer {
              requires com.ratelimitly.client;
          }
          EOF
          cat > "$RUNNER_TEMP/module-consumer/consumer/Consumer.java" <<'EOF'
          package consumer;

          import com.ratelimitly.RateLimitlyClient;
          import com.ratelimitly.RateLimitlyClientConfig;
          import com.ratelimitly.RateLimitlyClients;
          import com.ratelimitly.RateLimitlyException;

          public final class Consumer {
              private Consumer() {
              }

              static RateLimitlyClient open(String apiKey)
                      throws RateLimitlyException {
                  return RateLimitlyClients.create(
                      RateLimitlyClientConfig.builder(apiKey).build());
              }
          }
          EOF
          javac --release 21 \
            --module-path "$jar:$(cat "$RUNNER_TEMP/runtime-module-path.txt")" \
            -d "$RUNNER_TEMP/module-consumer-classes" \
            "$RUNNER_TEMP/module-consumer/module-info.java" \
            "$RUNNER_TEMP/module-consumer/consumer/Consumer.java"

      - name: Upload release jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jars
          path: ${{ runner.temp }}/release-jars/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload structural Central dry-run bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-dry-run-bundle
          path: ${{ runner.temp }}/central-dry-run-bundle.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  aggregate:
    name: Validate complete release
    if: needs.metadata.outputs.build == 'true'
    needs:
      - metadata
      - contracts
      - jars
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download every release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-inputs

      - name: Reject partial or unexpected release sets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/release-inputs"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"

          # The exact set, not "at least". A release missing the javadoc jar, or carrying a
          # stray extra file, fails here rather than shipping.
          expected=(
            "ratelimitly-java-client-${VERSION}-javadoc.jar"
            "ratelimitly-java-client-${VERSION}-sources.jar"
            "ratelimitly-java-client-${VERSION}.jar"
            "ratelimitly-java-client-${VERSION}.pom"
          )

          found=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "$assets/$name" ]]; then
              echo "::error::two build jobs produced an asset named ${name}"
              exit 1
            fi
            cp "$file" "$assets/$name"
            found+=("$name")
          done < <(find "$inputs" -type f -print0)

          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          printf '%s\n' "${found[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/found.txt"
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/found.txt"; then
            echo "::error::the built assets are not exactly the expected release set"
            exit 1
          fi

          ( cd "$assets" && sha256sum ./*.jar ./*.pom | sed 's#\./##' | LC_ALL=C sort -k2 > SHA256SUMS )
          {
            echo "### Release assets"
            echo
            echo '```'
            cat "$assets/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  central:
    name: Stage or verify Maven Central
    if: needs.metadata.outputs.action != 'dry-run'
    needs: [metadata, aggregate, preflight]
    environment: maven-central
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - name: Check operator and namespace readiness
        env:
          APPROVED: ${{ vars.MAVEN_CENTRAL_APPROVED }}
          FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$APPROVED" = true
          [[ "$FINGERPRINT" =~ ^[0-9A-Fa-f]{40}$ ]]
          mkdir -m 700 -p "$RUNNER_TEMP/release-gnupg"
          echo "GNUPGHOME=$RUNNER_TEMP/release-gnupg" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Refuse staging over a public coordinate
        if: needs.metadata.outputs.action == 'stage'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # This supplements, but never replaces, the explicit Portal inspection.
          # A 404 says nothing about a pending/validated Portal deployment.
          url="https://repo1.maven.org/maven2/com/ratelimitly/ratelimitly-java-client/$VERSION/ratelimitly-java-client-$VERSION.pom"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 --output /dev/null --write-out '%{http_code}' "$url")"
          test "$status" = 404

      - name: Import dedicated signing key
        if: needs.metadata.outputs.action == 'stage'
        env:
          SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$FINGERPRINT" >/dev/null

      - name: Build, compare, sign, and stage for manual Portal publication
        if: needs.metadata.outputs.action == 'stage'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_TOKEN"
          test -n "$MAVEN_GPG_PASSPHRASE"
          mkdir -p "$RUNNER_TEMP/central-handoff"
          printf 'commit=%s\nversion=%s\nrun=%s\n' "$COMMIT" "$VERSION" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/central-handoff/identity.txt"
          mvn -B -ntp -Pcentral-release -Dcentral.skipPublishing=false \
            "-Dcentral.deploymentName=rl-java-client-$VERSION-$COMMIT" \
            "-Dgpg.keyname=$FINGERPRINT" \
            "-Dproject.build.outputTimestamp=$SOURCE_DATE_EPOCH" \
            "-Drelease.expectedArtifacts=$GITHUB_WORKSPACE/release-assets" \
            clean deploy 2>&1 | tee "$RUNNER_TEMP/central-stage.log"
          echo "Staged only. Inspect and publish the existing deployment in Portal, then dispatch finalize." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve staging handoff after success or interruption
        if: always() && needs.metadata.outputs.action == 'stage'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/central-handoff"
          if [ -f target/central-publishing/central-bundle.zip ]; then
            cp target/central-publishing/central-bundle.zip "$RUNNER_TEMP/central-handoff/"
            (cd "$RUNNER_TEMP/central-handoff" && sha256sum central-bundle.zip > SHA256SUMS)
          fi
          if [ -f "$RUNNER_TEMP/central-stage.log" ]; then
            grep -Eo 'deploymentId: [0-9a-fA-F-]{36}' "$RUNNER_TEMP/central-stage.log" |
              sort -u > "$RUNNER_TEMP/central-handoff/deployment-id.txt" || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.metadata.outputs.action == 'stage'
        with:
          name: central-handoff
          path: ${{ runner.temp }}/central-handoff/*
          if-no-files-found: warn
          retention-days: 30

      - name: Verify the identified Portal deployment is already published
        if: needs.metadata.outputs.action == 'finalize'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_TOKEN"
          bearer="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_TOKEN" | base64 -w0)"
          echo "::add-mask::$bearer"
          # The header is supplied on stdin, not exposed in process arguments.
          printf 'header = "Authorization: Bearer %s"\n' "$bearer" |
            curl --config - --fail --silent --show-error --connect-timeout 10 --max-time 60 \
              --request POST "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" |
            python3 tools/publication_policy.py deployment "$DEPLOYMENT_ID" "$VERSION"

      - name: Compare public unsigned artifacts with this exact build
        if: needs.metadata.outputs.action == 'finalize'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/com/ratelimitly/ratelimitly-java-client/$VERSION"
          remote="$RUNNER_TEMP/existing-central-release"
          mkdir -p "$remote"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$FINGERPRINT"
          for suffix in .pom .jar -sources.jar -javadoc.jar; do
            file="ratelimitly-java-client-$VERSION$suffix"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 60 --output "$remote/$file" "$base/$file"
            cmp "release-assets/$file" "$remote/$file"
            for extension in asc sha256; do
              curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 \
                --connect-timeout 10 --max-time 60 --output "$remote/$file.$extension" "$base/$file.$extension"
            done
            expected="$(tr -d '[:space:]' < "$remote/$file.sha256" | tr 'A-F' 'a-f')"
            actual="$(sha256sum "$remote/$file" | cut -d ' ' -f 1)"
            test "$expected" = "$actual"
            gpg --batch --verify "$remote/$file.asc" "$remote/$file"
          done

      - name: Verify public Central resolution with a clean named-module consumer
        if: needs.metadata.outputs.action == 'finalize'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/com/ratelimitly/ratelimitly-java-client/${VERSION}"
          pom="ratelimitly-java-client-${VERSION}.pom"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 60 \
                --output /dev/null "${base}/${pom}"; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "::error::${pom} did not become visible from Maven Central"
              exit 1
            fi
            sleep 10
          done

          consumer="$RUNNER_TEMP/central-consumer"
          mkdir -p "$consumer/src/main/java/consumer"
          cat > "$consumer/pom.xml" <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>test.ratelimitly</groupId>
            <artifactId>central-consumer</artifactId>
            <version>1</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>
            <dependencies>
              <dependency>
                <groupId>com.ratelimitly</groupId>
                <artifactId>ratelimitly-java-client</artifactId>
                <version>${VERSION}</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.15.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF
          cat > "$consumer/src/main/java/module-info.java" <<'EOF'
          module ratelimitly.central.consumer {
              requires com.ratelimitly.client;
          }
          EOF
          cat > "$consumer/src/main/java/consumer/Consumer.java" <<'EOF'
          package consumer;

          import com.ratelimitly.RateLimitlyClient;
          import com.ratelimitly.RateLimitlyClientConfig;
          import com.ratelimitly.RateLimitlyClients;
          import com.ratelimitly.RateLimitlyException;

          public final class Consumer {
              private Consumer() {
              }

              static RateLimitlyClient open(String apiKey) throws RateLimitlyException {
                  return RateLimitlyClients.create(
                      RateLimitlyClientConfig.builder(apiKey).build());
              }
          }
          EOF
          mvn -B -ntp -U \
            -Dmaven.repo.local="$RUNNER_TEMP/clean-central-m2" \
            -f "$consumer/pom.xml" \
            verify

  attest:
    name: Attest release assets
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.action == 'finalize'
    needs:
      - metadata
      - aggregate
      - central
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Create build provenance attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'release-assets/*'

  publish:
    name: Publish atomic GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.action == 'finalize'
    needs:
      - metadata
      - aggregate
      - central
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Upload to a draft, verify, then publish
        shell: bash
        env:
          COMMIT: ${{ needs.metadata.outputs.commit }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          # Central publication and clean resolution have already succeeded. Assets land on a
          # draft first so a partial GitHub upload never becomes visible.
          find release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "\`ratelimitly-java-client\` ${VERSION}, built from ${COMMIT}."
            echo
            echo "Verify the assets with \`sha256sum -c SHA256SUMS\`. The jars are byte-reproducible"
            echo "from this commit."
            echo
            echo "Maven coordinate: \`com.ratelimitly:ratelimitly-java-client:${VERSION}\`."
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "::error::${TAG} is already published; refusing to overwrite it"
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --target "$COMMIT" \
              --title "$TAG" \
              --notes-file "$notes"
          fi

          # Assets land on a draft first. A half-uploaded release must never be visible.
          gh release upload "$TAG" release-assets/* --clobber

          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::${TAG} did not receive every asset; leaving it as a draft"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != false ]]; then
            echo "::error::${TAG} is still a draft after publishing"
            exit 1
          fi
          echo "Published ${TAG} at ${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
